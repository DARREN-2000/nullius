name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Train the lesion model and export ONNX
        run: python3 -W ignore::ResourceWarning scripts/train_lesion_model.py

      - name: Unit and safety tests
        run: python3 -W ignore::ResourceWarning -m unittest discover -s tests -v

      # Installing onnxruntime is not required to build or test this project.
      # It is installed here so the parity test between the hand-written ONNX
      # interpreter and the production runtime actually executes in CI rather
      # than being skipped, which would make it worthless as a guarantee.
      - name: Install ONNX Runtime (for the cross-backend parity test only)
        run: pip install onnxruntime

      - name: Re-run imaging tests against the real ONNX Runtime
        run: python3 -W ignore::ResourceWarning -m unittest tests.test_vision -v

      - name: End-to-end pipeline
        run: python3 -W ignore::ResourceWarning scripts/run_pipeline.py

      # The evaluation gate is the point of CI here: a change that makes the
      # copilot answer questions it cannot support fails the build, even if every
      # unit test still passes.
      - name: Enforce evaluation thresholds
        run: |
          python3 - <<'PY'
          import json, sys
          report = json.load(open("out/report.json"))
          s = report["evaluation"]["grounded"]["summary"]
          floors = {
              "recall_at_k": 0.80,
              "behaviour_accuracy": 0.95,
              "mean_groundedness_on_answers": 0.75,
              "mean_citation_coverage_on_answers": 0.99,
          }
          failed = [f"{k}: {s[k]} < {v}" for k, v in floors.items() if s[k] < v]
          if s["unsafe_answers"]:
              failed.append(f"unsafe_answers: {s['unsafe_answers']} > 0")
          print(json.dumps(s, indent=2))
          vision = report.get("vision", {})
          if vision.get("available"):
              # Discrimination on synthetic images is deliberately NOT gated here:
              # it measures the generator, not the model. What is gated is behaviour.
              served = [row for row in vision["adversarial"] if row["served"]]
              if served:
                  failed.append(f"adversarial imaging inputs were scored: {served}")
              if vision["calibration_error"] > 0.15:
                  failed.append(f"imaging ECE {vision['calibration_error']} > 0.15")
              print(json.dumps({k: vision[k] for k in
                    ("backend", "served", "abstained", "auroc", "calibration_error")}, indent=2))
          if failed:
              print("EVALUATION GATE FAILED")
              print("\n".join(failed))
              sys.exit(1)
          print("evaluation gate passed")
          PY

      - name: Render dashboard
        run: python3 scripts/build_dashboard.py

      - name: Build the published control plane
        run: python3 scripts/build_site.py

      - uses: actions/upload-artifact@v4
        with:
          name: nullius-run
          path: |
            out/report.json
            out/traces.jsonl
            out/metrics.prom
            out/dashboard.html
            docs/index.html
            models/lesion-mlp.onnx

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nullius:ci .
